<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="https://artifacts.wildreason.ai/kit/v1/kit.css">
</head><body>
<div class="wrap">
<header class="head"><span class="eyebrow">Board · {{variant}}</span>
<h1>{{headline}}</h1><p class="lede">{{lede}}</p></header>
<section>
<div data-vt="board"><script type="application/json">{"clusters":{{clusters}},"links":{{links}}}</script></div>

</section>
</div>
<script src="https://artifacts.wildreason.ai/kit/v1/kit.js"></script>
</body></html>
