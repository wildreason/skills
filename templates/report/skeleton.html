<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root{--ink:#12151a;--soft:#4a4f57;--faint:#8a8f97;--line:#e6e4de;--blue:#1d5bd8;--yellow:#c6901a;--red:#c2566a;--bg:#fbfaf7}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 ui-sans-serif,-apple-system,system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:48px 20px 96px}
h1{font-size:30px;margin:0 0 8px}
h2{font-size:19px;margin:40px 0 10px}
.lede{color:var(--soft)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
td.n,th.n{text-align:right}
tr.total td{font-weight:700;border-top:2px solid var(--ink)}
.verdict{font-weight:700;margin-top:14px}
footer{margin-top:48px;color:var(--faint);font-size:13px}
</style></head>
<body><div class="wrap">
<h1>{{title}}</h1>
<p class="lede">{{lede}}</p>
<h2>Result</h2>
<table>
<tr><th>Config</th><th class="n">{{metric}}</th></tr>
<tr><td>{{row_1}}</td><td class="n">{{value_1}}</td></tr>
<tr><td>{{row_2}}</td><td class="n">{{value_2}}</td></tr>
<tr class="total"><td>Total</td><td class="n">{{total}}</td></tr>
</table>
<p class="verdict">{{verdict}}</p>
<h2>Limitations</h2>
<p>{{limitations}}</p>
<footer><h2>Sources</h2><p>{{sources}}</p></footer>
</div></body></html>
