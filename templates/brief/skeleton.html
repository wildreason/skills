<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root{--ink:#111214;--soft:#555a63;--line:#e4e4e0;--blue:#1d5bd8;--yellow:#e8b400;--red:#d4351c;--bg:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 ui-sans-serif,-apple-system,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:56px 20px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
h1{font-size:34px;line-height:1.15;margin:8px 0 12px}
h2{font-size:20px;margin:40px 0 10px}
.lede{color:var(--soft);font-size:18px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;margin-right:6px}
.b-blue{background:var(--blue);color:#fff}.b-yellow{background:var(--yellow);color:var(--ink)}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.foot{margin-top:48px;color:var(--soft);font-size:13px}
</style></head>
<body><div class="wrap">
<div class="kicker">Release brief</div>
<h1>{{outcome}}</h1>
<p class="lede">{{lede}}</p>
<span class="badge b-blue">shipped</span><span class="badge b-yellow">in flight</span>
<h2>What we are building</h2>
<p>{{building}}</p>
<h2>What shipped</h2>
<p>{{shipped}}</p>
<table><tr><th>Before</th><th>After</th></tr><tr><td>{{before}}</td><td>{{after}}</td></tr></table>
<h2>What is coming</h2>
<p>{{next}}</p>
<h2>What you will come to see</h2>
<p>{{payoff}}</p>
<div class="foot">{{foot}}</div>
</div></body></html>
