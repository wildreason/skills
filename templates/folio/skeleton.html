<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root{--paper:#f4efe5;--ink:#141414;--soft:#4b4b4b;--blue:#1d5bd8;--yellow:#e8b400;--red:#d4351c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#15140f;--ink:#f1ece2;--soft:#b9b3a6}}
:root[data-theme=dark]{--paper:#15140f;--ink:#f1ece2;--soft:#b9b3a6}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 'Libre Franklin',system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:40px 16px 96px}
h1,h2{font-family:Newsreader,Georgia,serif;font-weight:500}
h1{font-size:clamp(32px,6vw,56px);line-height:1.08}
.hero img{width:100%;height:auto}
section{margin-top:64px}
.rise{animation:rise .6s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none}}
</style></head>
<body><div class="wrap">
<header class="hero rise"><img alt="" src="{{hero_art}}"><h1>{{chasing}}</h1></header>
<section><h2>The map</h2>{{map}}</section>
<section><h2>What carries the weight</h2>{{items}}</section>
<section><h2>The ranking</h2>{{ranking}}</section>
<section><h2>Risks</h2>{{risks}}</section>
<section><h2>Asks</h2>{{asks}}</section>
<section><h2>Appendix</h2>{{appendix}}</section>
</div></body></html>
