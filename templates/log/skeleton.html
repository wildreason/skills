<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root{--ground:#f4efe5;--ink:#12151a;--soft:#4a4f57;--faint:#8a8f97;--stroke:rgba(18,21,26,.09);--blue:#1d5bd8;--yellow:#c6901a;--red:#c2566a}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:56px 20px 120px}
.eyebrow{font:11px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
h1{font:400 44px/1.05 Georgia,serif;margin:0 0 14px}
.lede{color:var(--soft);max-width:740px}
h2.week{font:400 26px Georgia,serif;margin:48px 0 8px}
.week-rule{border-top:1px solid var(--stroke);margin-bottom:12px}
.entry{background:#fff;border:1px solid var(--stroke);border-radius:12px;padding:14px 16px;margin:10px 0}
.vbadge{font:600 11px ui-monospace,Menlo,monospace;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--blue);color:#fff}
.sub{color:var(--faint);font-size:13px}
.verdict-line{font-weight:600;margin-top:8px}
footer{margin-top:48px;color:var(--faint);font:12px ui-monospace,Menlo,monospace}
</style></head>
<body><div class="wrap">
<p class="eyebrow">{{eyebrow}}</p>
<h1>{{title}}</h1>
<p class="lede">{{lede}}</p>
<h2 class="week">{{period}}</h2>
<div class="week-rule"></div>
<div class="entry" data-verdict="{{verdict_key}}">
<span class="vbadge">{{verdict}}</span>
<h3>{{entry_title}}</h3>
<div class="sub">{{entry_meta}}</div>
<p>{{entry_body}}</p>
<p class="verdict-line">{{verdict_line}}</p>
</div>
<footer>updated {{updated}}</footer>
</div></body></html>
