<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root{--ink:#111214;--ink-soft:#5b5e66;--ground:#f3f3f1;--sheet:#fff;--hairline:#e6e6e2}
@media (prefers-color-scheme:dark){:root{--ink:#f2f2f0;--ink-soft:#a3a6ad;--ground:#0f1012;--sheet:#1a1b1e;--hairline:#2b2c30}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font:15px/1.55 ui-sans-serif,-apple-system,system-ui,sans-serif}
.sheet{width:min(432px,100%);background:var(--sheet);border-radius:20px;padding:30px;box-shadow:0 12px 40px -12px rgba(0,0,0,.18)}
h1{font-size:20px;font-weight:600;margin:0 0 10px}
p{color:var(--ink-soft);margin:0}
hr{border:0;border-top:1px solid var(--hairline);margin:22px 0}
.btn-primary{display:inline-block;background:var(--ink);color:var(--sheet);border-radius:999px;padding:9px 18px;text-decoration:none;font-weight:600}
</style></head>
<body><main class="sheet">
<h1>{{title}}</h1>
<p>{{body}}</p>
<hr>
<a class="btn-primary" href="{{action_href}}">{{action}}</a>
</main></body></html>
