<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="https://artifacts.wildreason.ai/kit/v1/kit.css">
</head><body>
<div class="wrap">
<header class="head"><span class="eyebrow">New fellow · {{department}}</span>
<h1>{{headline}}</h1>
<p class="lede"><span class="chip state"><span class="dot {{state_dot}}" aria-hidden="true"></span> {{state}}</span> {{state_line}}</p></header>
<section><h2>The fellow</h2><dl class="setup">
<dt>Name</dt><dd>{{name}}</dd>
<dt>Handle</dt><dd>{{handle}}</dd>
<dt>Department</dt><dd>{{department}}</dd>
<dt>Purpose</dt><dd>{{purpose}}</dd>
<dt>Runs on</dt><dd>{{runs_on}}</dd>
</dl></section>
<section><h2>Your go</h2>
<dl class="ask"><dt>Answer</dt><dd>{{ask}}</dd><dt>In</dt><dd>{{room}}</dd><dt>Proposed by</dt><dd>{{proposed_by}}</dd></dl>
<p class="source">Updated {{updated}}</p></section>
</div>
<script src="https://artifacts.wildreason.ai/kit/v1/kit.js"></script>
</body></html>
