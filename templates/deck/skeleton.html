<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root{--ground:#fbfaf7;--ink:#12151a;--soft:#4a4f57;--faint:#8a8f97;--hairline:#e7e4dc;--blue:#1d5bd8;
--serif:Georgia,'Times New Roman',serif;--font:ui-sans-serif,-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);line-height:1.6}
.wrap{max-width:64rem;margin:0 auto;padding:0 clamp(1rem,5vw,3rem)}
section{padding:clamp(3rem,9vh,6rem) 0;border-top:1px solid var(--hairline)}
section:first-of-type{border-top:none}
.eyebrow{font:.72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);display:flex;gap:.9rem}
.num{color:var(--blue);font-weight:600}
h1,h2,.close p{font-family:var(--serif);font-weight:600;letter-spacing:-.015em}
h1{font-size:clamp(2.4rem,7vw,4.4rem);margin:.4em 0 0}
h2{font-size:clamp(1.8rem,4.4vw,2.8rem);margin:.6rem 0 0}
.lede{color:var(--soft);max-width:60ch}
.close p{font-size:clamp(1.5rem,3.5vw,2.2rem)}
footer{font:.8rem var(--mono);color:var(--faint);padding:2rem 0}
</style></head>
<body>
<section class="cover"><div class="wrap">
<p class="eyebrow"><span>{{context}}</span></p>
<h1>{{claim}}</h1>
<p class="lede">{{thesis}}</p>
</div></section>
<section><div class="wrap">
<p class="eyebrow"><span class="num">01</span><span>{{topic_1}}</span></p>
<h2>{{point_1}}</h2>
<p class="lede">{{support_1}}</p>
</div></section>
<section><div class="wrap">
<p class="eyebrow"><span class="num">02</span><span>{{topic_2}}</span></p>
<h2>{{point_2}}</h2>
<p class="lede">{{support_2}}</p>
</div></section>
<section class="close"><div class="wrap"><p>{{close}}</p></div></section>
<footer><div class="wrap">{{meta}}</div></footer>
</body></html>
